name: General Issue / 通用问题
description: Report a bug, request a feature, or ask a question / 报告 Bug、提出功能请求或提问
title: "[Issue]: "
labels: ["needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to open an issue!
        感谢你花时间提交 issue！

        Please fill out the information below as clearly as possible.
        请尽量清楚地填写以下信息。

  - type: dropdown
    id: issue-type
    attributes:
      label: Issue Type / 问题类型
      description: What kind of issue is this? / 这是哪种类型的问题？
      options:
        - Bug report / Bug 报告
        - Feature request / 功能请求
        - Documentation / 文档问题
        - Question / 使用问题
        - Other / 其他
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary / 概要
      description: Briefly describe the issue or request. / 简要描述这个问题或请求。
      placeholder: |
        English: A short summary of the issue...
        中文：简要说明这个 issue 的内容……
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details / 详细说明
      description: Provide more details, context, screenshots, logs, or examples if applicable. / 请提供更多细节、上下文、截图、日志或示例。
      placeholder: |
        English:
        Please describe what happened, what you expected, and any relevant context.

        中文：
        请描述发生了什么、你期望的结果，以及相关背景信息。
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce / 复现步骤
      description: If this is a bug, list the steps to reproduce it. / 如果这是 Bug，请列出复现步骤。
      placeholder: |
        1. Go to ... / 打开……
        2. Click ... / 点击……
        3. See error ... / 看到错误……
    validations:
      required: false

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior / 期望行为
      description: What did you expect to happen? / 你期望发生什么？
      placeholder: |
        English: I expected...
        中文：我期望……
    validations:
      required: false

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior / 实际行为
      description: What actually happened? / 实际发生了什么？
      placeholder: |
        English: What actually happened was...
        中文：实际情况是……
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment / 环境信息
      description: Please provide relevant environment details. / 请提供相关环境信息。
      value: |
        - OS / 操作系统:
        - Browser / 浏览器:
        - Version / 版本:
        - Device / 设备:
      render: markdown
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs or Screenshots / 日志或截图
      description: Paste logs, error messages, or attach screenshots if available. / 如有，请粘贴日志、错误信息，或上传截图。
      placeholder: |
        Paste logs here.
        在这里粘贴日志。
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist / 检查清单
      description: Please confirm the following before submitting. / 提交前请确认以下内容。
      options:
        - label: I have searched existing issues. / 我已搜索过现有 issues。
          required: true
        - label: I have provided enough information to understand the issue. / 我已提供足够信息来理解该问题。
          required: true
        - label: I am willing to help test or provide more information if needed. / 如有需要，我愿意协助测试或提供更多信息。
          required: false
